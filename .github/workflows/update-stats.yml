name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Stats Card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'bg_color=0D1117&title_color=d8b4fe&text_color=e9d5ff&icon_color=c084fc&show_icons=true'
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          
      - name: Generate Langs Card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'bg_color=0D1117&title_color=d8b4fe&text_color=e9d5ff&icon_color=c084fc&layout=compact'
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: auto-update github stats cards" || exit 0
          git push
